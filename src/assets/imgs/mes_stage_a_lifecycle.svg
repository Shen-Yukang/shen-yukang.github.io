<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" rx="40" fill="#F8F6F0"/>
  <text x="104" y="120" fill="#1F2D3D" font-family="Georgia, serif" font-size="46" font-weight="700">Memory Lifecycle Control</text>
  <text x="104" y="164" fill="#516173" font-family="Arial, sans-serif" font-size="24">Stage A treats memory as a managed system, not a passive log dump.</text>
  <circle cx="310" cy="474" r="128" fill="#F1FBF7" stroke="#5AA082" stroke-width="4"/>
  <text x="260" y="456" fill="#174B38" font-family="Georgia, serif" font-size="34" font-weight="700">Write</text>
  <text x="226" y="500" fill="#2D5E4B" font-family="Arial, sans-serif" font-size="22">new useful memory</text>
  <circle cx="648" cy="300" r="110" fill="#EEF6FF" stroke="#5C8FD6" stroke-width="4"/>
  <text x="582" y="288" fill="#1D4678" font-family="Georgia, serif" font-size="34" font-weight="700">Merge</text>
  <text x="548" y="330" fill="#3A628F" font-family="Arial, sans-serif" font-size="22">strengthen repeated patterns</text>
  <circle cx="958" cy="300" r="110" fill="#FFF9E8" stroke="#D0A63A" stroke-width="4"/>
  <text x="902" y="288" fill="#7A5C12" font-family="Georgia, serif" font-size="34" font-weight="700">Stub</text>
  <text x="862" y="330" fill="#8B742E" font-family="Arial, sans-serif" font-size="22">keep a lightweight pointer</text>
  <circle cx="1290" cy="474" r="128" fill="#FFF5F2" stroke="#D87B59" stroke-width="4"/>
  <text x="1216" y="456" fill="#7B3017" font-family="Georgia, serif" font-size="34" font-weight="700">Forget</text>
  <text x="1178" y="500" fill="#9A4A2E" font-family="Arial, sans-serif" font-size="22">drop low-value clutter safely</text>
  <path d="M424 424L556 338" stroke="#365447" stroke-width="6" stroke-linecap="round"/>
  <path d="M758 300H848" stroke="#365447" stroke-width="6" stroke-linecap="round"/>
  <path d="M1058 338L1188 424" stroke="#365447" stroke-width="6" stroke-linecap="round"/>
  <path d="M1172 600L1030 692H560L420 600" stroke="#365447" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 12"/>
  <rect x="534" y="594" width="532" height="160" rx="28" fill="#FFFFFF" stroke="#1F2D3D" stroke-width="3"/>
  <text x="578" y="648" fill="#1F2D3D" font-family="Georgia, serif" font-size="30" font-weight="700">Hard Constraint</text>
  <text x="578" y="692" fill="#516173" font-family="Arial, sans-serif" font-size="22">Risk-bearing memories must preserve minimum safety coverage.</text>
  <text x="578" y="726" fill="#516173" font-family="Arial, sans-serif" font-size="22">Unsafe episodes are evidence, not noise.</text>
</svg>
