<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" rx="40" fill="#F7F4EE"/>
  <text x="100" y="122" fill="#1E293B" font-family="Georgia, serif" font-size="46" font-weight="700">Integration Ladder</text>
  <text x="100" y="168" fill="#475569" font-family="Arial, sans-serif" font-size="24">How MES becomes useful before any VLA fine-tuning.</text>
  <rect x="104" y="280" width="300" height="212" rx="28" fill="#FFF8EF" stroke="#D2B48C" stroke-width="4"/>
  <text x="138" y="338" fill="#6B4F2A" font-family="Georgia, serif" font-size="34" font-weight="700">L1 Prompt Constraint</text>
  <text x="138" y="388" fill="#7D6847" font-family="Arial, sans-serif" font-size="23">Inject natural-language warnings,</text>
  <text x="138" y="420" fill="#7D6847" font-family="Arial, sans-serif" font-size="23">repair notes, and task priors.</text>
  <rect x="454" y="230" width="300" height="262" rx="28" fill="#F1FBF7" stroke="#5AA082" stroke-width="4"/>
  <text x="488" y="288" fill="#174B38" font-family="Georgia, serif" font-size="34" font-weight="700">L2 Action Rerank</text>
  <text x="488" y="338" fill="#2D5E4B" font-family="Arial, sans-serif" font-size="23">Score candidates by risk,</text>
  <text x="488" y="370" fill="#2D5E4B" font-family="Arial, sans-serif" font-size="23">feasibility, support, evidence.</text>
  <rect x="488" y="404" width="182" height="42" rx="21" fill="#DDF3E9"/>
  <text x="522" y="431" fill="#174B38" font-family="Arial, sans-serif" font-size="20" font-weight="700">current sweet spot</text>
  <rect x="804" y="280" width="300" height="212" rx="28" fill="#EEF6FF" stroke="#5C8FD6" stroke-width="4"/>
  <text x="838" y="338" fill="#1D4678" font-family="Georgia, serif" font-size="34" font-weight="700">L3 Token Injection</text>
  <text x="838" y="388" fill="#3A628F" font-family="Arial, sans-serif" font-size="23">Encode MemoryIR into a tighter</text>
  <text x="838" y="420" fill="#3A628F" font-family="Arial, sans-serif" font-size="23">internal conditioning channel.</text>
  <rect x="1154" y="230" width="300" height="262" rx="28" fill="#FFF5F2" stroke="#D87B59" stroke-width="4"/>
  <text x="1188" y="288" fill="#7B3017" font-family="Georgia, serif" font-size="34" font-weight="700">L4 Learned Memory</text>
  <text x="1188" y="338" fill="#9A4A2E" font-family="Arial, sans-serif" font-size="23">Jointly learn writing, retrieval,</text>
  <text x="1188" y="370" fill="#9A4A2E" font-family="Arial, sans-serif" font-size="23">and use over longer horizons.</text>
  <path d="M404 386H454" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <path d="M754 386H804" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <path d="M1104 386H1154" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <rect x="368" y="610" width="864" height="132" rx="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <text x="416" y="662" fill="#1E293B" font-family="Arial, sans-serif" font-size="26" font-weight="700">Key message for the talk:</text>
  <text x="416" y="704" fill="#475569" font-family="Arial, sans-serif" font-size="24">MES improves downstream decisions first as an external memory substrate, then grows toward deeper VLA integration.</text>
</svg>
